events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=connection_limit:10m;

    # =============================================================
    # Upstream Recensement
    # =============================================================
    upstream portal {
        server ecc-portal:8000;
    }

    # =============================================================
    # Upstream CST / CSMO
    #
    # Important :
    # Le domaine public cst.ecc.bj ne doit plus pointer directement
    # vers cst-frontend:3000.
    #
    # Il doit pointer vers le gateway interne du projet CST.
    # Le gateway CST se charge ensuite de router :
    # /              -> frontend Next.js
    # /api/          -> backend Django
    # /backoffice/   -> backend Django
    # /media/        -> médias CST
    # /cst-static/   -> statiques Django CST
    # /django-admin/ -> backend Django
    # =============================================================
    upstream cst_gateway {
        server cst-gateway:8080;
    }

    # =============================================================
    # Default HTTP — refuse les domaines non reconnus
    # =============================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;

        access_log off;
        return 444;
    }

    # =============================================================
    # Default HTTPS — refuse les domaines non reconnus
    # =============================================================
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;

        server_name _;

        ssl_certificate /etc/letsencrypt/live/recensement-paroisses.ecc.bj/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/recensement-paroisses.ecc.bj/privkey.pem;

        access_log off;
        return 444;
    }

    # =============================================================
    # CST / CSMO — HTTP
    # Sert uniquement le challenge Certbot puis redirige vers HTTPS.
    # =============================================================
    server {
        listen 80;
        listen [::]:80;

        server_name cst.ecc.bj;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://cst.ecc.bj$request_uri;
        }
    }

    # =============================================================
    # Recensement — HTTP
    # Ne pas modifier.
    # =============================================================
    server {
        listen 80;
        listen [::]:80;

        server_name recensement-paroisses.ecc.bj;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://recensement-paroisses.ecc.bj$request_uri;
        }
    }

    # =============================================================
    # Recensement — HTTPS
    # Ne pas modifier.
    # =============================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name recensement-paroisses.ecc.bj;

        ssl_certificate /etc/letsencrypt/live/recensement-paroisses.ecc.bj/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/recensement-paroisses.ecc.bj/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        client_max_body_size 20M;
        charset utf-8;
        server_tokens off;

        limit_conn connection_limit 20;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

        error_page 400 /__errors/400.html;
        error_page 403 /__errors/403.html;
        error_page 404 /__errors/404.html;
        error_page 405 /__errors/405.html;
        error_page 413 /__errors/413.html;
        error_page 429 /__errors/429.html;
        error_page 500 /__errors/500.html;
        error_page 502 /__errors/502.html;
        error_page 503 /__errors/503.html;
        error_page 504 /__errors/504.html;

        location ^~ /__errors/ {
            internal;
            alias /static/recensement/errors/;
            default_type text/html;
            charset utf-8;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location ~* \.php(?:/|$) {
            access_log off;
            log_not_found off;
            return 404;
        }

        location ~* ^/(?:wp-admin|wp-content|wp-includes)(?:/|$) {
            access_log off;
            log_not_found off;
            return 404;
        }

        location = /wp-login.php {
            access_log off;
            log_not_found off;
            return 404;
        }

        location = /xmlrpc.php {
            access_log off;
            log_not_found off;
            return 404;
        }

        location /static/ {
            alias /static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location = /accounts/login/ {
            limit_req zone=login_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://portal;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_redirect off;
        }

        location / {
            limit_req zone=general_limit burst=30 nodelay;
            limit_req_status 429;

            proxy_pass http://portal;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_redirect off;

            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }

    # =============================================================
    # CST / CSMO — HTTPS
    #
    # Très important :
    # cst.ecc.bj pointe vers cst-gateway:8080.
    # Il ne doit plus pointer directement vers cst-frontend:3000.
    # =============================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name cst.ecc.bj;

        ssl_certificate /etc/letsencrypt/live/cst.ecc.bj/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cst.ecc.bj/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        charset utf-8;
        server_tokens off;

        # Limite générale CST.
        # Les routes spécialisées ci-dessous affinent les limites d'upload.
        client_max_body_size 55M;

        access_log /var/log/nginx/cst_access.log;
        error_log /var/log/nginx/cst_error.log warn;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # API CST.
        location ^~ /api/ {
            proxy_pass http://cst_gateway;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_redirect off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Upload chunké Galerie.
        # Les morceaux applicatifs font environ 8 Mo.
        # On laisse une marge à 20M pour le multipart.
        location ^~ /backoffice/gallery/uploads/ {
            client_max_body_size 20M;
            proxy_request_buffering off;

            proxy_pass http://cst_gateway;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_redirect off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;
        }

        # Documents CST.
        # Upload classique jusqu'à 100 Mo côté Django.
        location ^~ /backoffice/documents/ {
            client_max_body_size 120M;

            proxy_pass http://cst_gateway;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_redirect off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 180s;
            proxy_read_timeout 300s;
        }

        # Back-office CST général :
        # actualités, albums, formulaires, couvertures, authentification OTP.
        location ^~ /backoffice/ {
            client_max_body_size 55M;

            proxy_pass http://cst_gateway;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_redirect off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;
        }

        # Admin Django CST.
        location ^~ /django-admin/ {
            client_max_body_size 55M;

            proxy_pass http://cst_gateway;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_redirect off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;
        }

        # Médias CST servis par le gateway CST.
        location ^~ /media/ {
            proxy_pass http://cst_gateway;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_redirect off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Fichiers statiques Django CST servis par le gateway CST.
        location ^~ /cst-static/ {
            proxy_pass http://cst_gateway;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_redirect off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Frontend public CST.
        # Toutes les autres routes passent au gateway,
        # qui les transmet au frontend Next.js.
        location / {
            proxy_pass http://cst_gateway;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_redirect off;

            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}