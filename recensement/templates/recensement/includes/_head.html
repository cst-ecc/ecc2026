{% load static %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#054771">
<meta name="author" content="Église du Christianisme Céleste - Conseil Supérieur de Transition (CST)">

<title>{% block title %}Recensement des paroisses{% endblock %}</title>
<meta name="description" content="{% block meta_description %}Plateforme de recensement des paroisses de l’Église du Christianisme Céleste.{% endblock %}">

{% block robots_meta %}
  {% if user.is_authenticated %}
    <meta name="robots" content="noindex,nofollow,noarchive">
  {% else %}
    <meta name="robots" content="index,follow">
  {% endif %}
{% endblock %}

{% block canonical_url %}{% endblock %}

<link rel="icon" href="{% static 'recensement/img/favicon.ico' %}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'recensement/img/favicon-32x32.png' %}">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'recensement/img/favicon-192x192.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'recensement/img/apple-touch-icon.png' %}">

{% block social_meta %}
  <meta property="og:title" content="{% block og_title %}Recensement des paroisses{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Plateforme de recensement des paroisses de l’Église du Christianisme Céleste.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:image" content="{% static 'recensement/img/logo-cst.png' %}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% block twitter_title %}Recensement des paroisses{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}Plateforme de recensement des paroisses de l’Église du Christianisme Céleste.{% endblock %}">
{% endblock %}

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            50:'#eef8fe',100:'#d9effd',200:'#b8e1fb',300:'#81ccf7',
            400:'#42aef0',500:'#188bd5',600:'#0b6eae',700:'#085789',
            800:'#06456d',900:'#043653',950:'#022238'
          },
          accent: {
            50:'#fffdeb',100:'#fff9c7',200:'#fff38a',300:'#ffe84d',
            400:'#ffdb1f',500:'#f5c800',600:'#c79b00',700:'#947000',
            800:'#795a06',900:'#654a0a'
          }
        },
        boxShadow: { soft: '0 10px 30px rgba(2,34,56,.08)' }
      }
    }
  };
</script>
<link href="{% static 'recensement/css/style.css' %}" rel="stylesheet">
{% block extra_head %}{% endblock %}
