{% comment %}
Sélecteur d'indicatif téléphonique international.

Variables attendues :
  cible (str, obligatoire) : id du champ texte piloté par phone_country.js
                             (data-phone-target), par ex. "id_contact_responsable".

La liste des pays est désormais maintenue à un seul endroit.
