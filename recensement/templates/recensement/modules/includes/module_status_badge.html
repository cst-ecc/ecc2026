{% if statut == "actif" %}
  <span class="inline-flex rounded-full bg-green-50 px-2.5 py-1 text-xs font-semibold text-green-700">Actif</span>
{% elif statut == "partiel" %}
  <span class="inline-flex rounded-full bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-700">Partiel</span>
{% else %}
  <span class="inline-flex rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600">En construction</span>
{% endif %}
