<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>400 — Recensement ECC</title>
    <style>
        :root {
            --b: #0b6eae;
            --d: #022238;
            --l: #dbe5ec;
            --a: #f5c800
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            background: radial-gradient(circle at 20% 15%, rgba(24, 139, 213, .13), transparent 35%), #f8fafc;
            color: #0f172a
        }

        main {
            width: min(660px, 100%)
        }

        .brand {
            font-weight: 800;
            color: #043653;
            margin-bottom: 14px
        }

        .card {
            background: #fff;
            border: 1px solid var(--l);
            border-radius: 20px;
            box-shadow: 0 18px 55px rgba(2, 34, 56, .09);
            overflow: hidden
        }

        .bar {
            height: 6px;
            background: linear-gradient(90deg, var(--b), #188bd5, var(--a))
        }

        .c {
            padding: 32px
        }

        .code {
            color: var(--b);
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
            font-size: .82rem
        }

        h1 {
            color: var(--d);
            font-size: 2rem;
            margin: 8px 0 10px
        }

        p {
            color: #475569;
            line-height: 1.65
        }

        a {
            display: inline-block;
            margin-top: 18px;
            padding: 11px 16px;
            border-radius: 10px;
            background: var(--b);
            color: #fff;
            text-decoration: none;
            font-weight: 700
        }
    </style>
</head>

<body>
    <main>
        <div class="brand">ECC · Recensement des paroisses</div>
        <section class="card">
            <div class="bar"></div>
            <div class="c">
                <div class="code">Erreur 400</div>
                <h1>Requête incorrecte</h1>
                <p>La requête envoyée ne peut pas être traitée.</p><a href="/">Retour à l’accueil</a>
            </div>
        </section>
    </main>
</body>

</html>
